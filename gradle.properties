# Build performance (4 cores / 16 GB sandbox)
org.gradle.jvmargs=-Xmx3g -XX:+UseParallelGC -Dfile.encoding=UTF-8
kotlin.daemon.jvmargs=-Xmx2g
org.gradle.parallel=true
org.gradle.caching=true

# The shipped app deliberately uses NO AndroidX libraries (size + startup on a low-RAM Go device): scripts/verify.sh audits the APK's dex.
# The flag itself is only needed so the Robolectric TEST classpath (which pulls androidx.test) is accepted.
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official
# :geckoapp compiles against API 37 (GeckoView 160 requires it); AGP 8.13 officially supports up to 36.
android.suppressUnsupportedCompileSdk=37.0,37
