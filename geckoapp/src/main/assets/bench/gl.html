<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>bench gl</title><script src="common.js"></script></head>
<body><canvas id="cv" width="32" height="32"></canvas>
<script>
// WebGL on its own page, last in the suite: making a WebGL context is the one probe that can wedge the whole page process on a machine whose drawing path is broken (the emulator lab: it never came back). The app gives this page 25 s; a page
// that does not answer counts as "no WebGL" and the app ends the engine's helper processes so the next sample starts clean.
K.run('gl', function () {
  document.title = 'bench-at webgl';
  return K.sleep(25).then(function () {
    var c = document.getElementById('cv'), gl = c.getContext('webgl') || c.getContext('experimental-webgl');
    if (!gl) return { gl_ok: 0 };
    gl.clearColor(0, 1, 0, 1); gl.clear(gl.COLOR_BUFFER_BIT);
    var px = new Uint8Array(4); gl.readPixels(0, 0, 1, 1, gl.RGBA, gl.UNSIGNED_BYTE, px);
    return { gl_ok: px[1] > 200 ? 1 : 0 };
  });
});
</script></body></html>
