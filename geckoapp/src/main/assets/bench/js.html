<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>bench js</title><script src="common.js"></script></head>
<body><pre id="o">script speed</pre>
<script>
// Script speed: the work a heavy page does, in fixed sizes. Each sub-test runs 3 times, the median counts; script_ms is their sum.
K.run('js', function () {
  var F = K.fast ? 0.1 : 1, out = {};
  function pass(name, fn) { var t = []; for (var i = 0; i < 3; i++) { var a = K.now(); fn(); t.push(K.now() - a); } out['js_' + name] = K.round(K.median(t)); }
  var sink = 0;
  pass('int', function () { var x = 123456789, n = (1500000 * F) | 0; for (var i = 0; i < n; i++) { x ^= x << 13; x ^= x >>> 17; x ^= x << 5; sink += x & 7; } });
  pass('float', function () { var a = 0, n = (500000 * F) | 0; for (var i = 0; i < n; i++) a += Math.sqrt(i) * Math.sin(i * 0.001); sink += a; });
  pass('str', function () { var parts = [], n = (12000 * F) | 0; for (var i = 0; i < n; i++) parts.push('item-' + i + '-' + (i * 7919 % 1000)); var s = parts.join(','); var m = s.split(',').filter(function (x) { return /-(\d)\1/.test(x); }); sink += m.length + s.length; });
  pass('json', function () { var o = []; for (var i = 0; i < ((1500 * F) | 0); i++) o.push({ id: i, name: 'n' + i, tags: ['a', 'b', 'c'], pos: { x: i, y: i * 2 }, ok: i % 2 === 0 }); for (var k = 0; k < 4; k++) o = JSON.parse(JSON.stringify(o)); sink += o.length; });
  pass('sort', function () { var a = [], r = 1; for (var i = 0; i < ((60000 * F) | 0); i++) { r = (r * 1103515245 + 12345) & 0x7fffffff; a.push(r); } a.sort(function (x, y) { return x - y; }); var b = a.slice(0, (12000 * F) | 0).map(function (v, i) { return { k: v % 977, i: i }; }); b.sort(function (x, y) { return x.k - y.k || x.i - y.i; }); sink += a[0] + b.length; });
  pass('alloc', function () { var keep = []; for (var i = 0; i < ((150000 * F) | 0); i++) { var o = { a: i, b: [i, i + 1], c: 'x' + i }; if (i % 7 === 0) keep.push(o); if (keep.length > 5000) keep = keep.slice(2500); } sink += keep.length; });
  pass('dom', function () { var host = document.createElement('div'); document.body.appendChild(host); var n = (1500 * F) | 0; for (var i = 0; i < n; i++) { var e = document.createElement('div'); e.className = 'c' + (i % 5); e.setAttribute('data-i', i); e.textContent = 'row ' + i; host.appendChild(e); } sink += host.offsetHeight; host.parentNode.removeChild(host); });
  var total = 0; for (var k in out) total += out[k];
  out.script_ms = K.round(total); out.sink = sink & 1;
  return out;
});
</script></body></html>
