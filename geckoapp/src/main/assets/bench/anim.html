<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>bench anim</title><script src="common.js"></script>
<style>
html,body{margin:0;background:#101418;overflow:hidden}
.arm{position:absolute;left:0;top:0;width:100%;height:100%;display:none;overflow:hidden}
.box{position:absolute;width:34px;height:34px;border-radius:6px;background:#3a7bd5}
@keyframes sway{0%{transform:translate(0,0) rotate(0)}50%{transform:translate(120px,40px) rotate(180deg)}100%{transform:translate(0,0) rotate(360deg)}}
.blobs div{position:absolute;width:260px;height:260px;border-radius:50%;filter:blur(18px);opacity:.8}
.glass{position:absolute;left:30px;top:120px;width:300px;height:160px;border-radius:14px;background:rgba(255,255,255,.12);backdrop-filter:blur(8px);box-shadow:0 8px 30px rgba(0,0,0,.5)}
@keyframes drift{0%{transform:translate(0,0)}100%{transform:translate(160px,80px)}}
.strip{position:absolute;top:120px;left:0;white-space:nowrap;animation:slide 6s linear infinite}
@keyframes slide{0%{transform:translateX(0)}100%{transform:translateX(-300px)}}
.strip video{width:160px;height:90px;margin-right:8px;background:#222}
</style></head>
<body>
<div class="arm" id="a"></div>
<div class="arm" id="b"><div class="blobs" id="blobs"></div><div class="glass"></div></div>
<div class="arm" id="c"><div class="strip" id="strip"></div></div>
<script>
// Animation smoothness, three arms of 3 s each: (A) boxes moved by CSS and by script, (B) big blurred gradients with a frosted-glass panel, (C) a strip of small looping muted clips like the sports-odds page.
K.run('anim', function () {
  var ms = K.fast ? 600 : 3000, out = {}, arm = ['a', 'b', 'c'];
  function show(id) { arm.forEach(function (x) { document.getElementById(x).style.display = x === id ? 'block' : 'none'; }); }
  var A = document.getElementById('a'), boxes = [];
  for (var i = 0; i < 40; i++) { var b = document.createElement('div'); b.className = 'box'; b.style.left = (10 + (i % 8) * 42) + 'px'; b.style.top = (20 + ((i / 8) | 0) * 60) + 'px'; if (i < 20) b.style.animation = 'sway ' + (2 + i % 3) + 's ease-in-out infinite'; A.appendChild(b); boxes.push(b); }
  var BL = document.getElementById('blobs'), cols = ['#ff5f6d', '#ffc371', '#36d1dc', '#5b86e5', '#a18cd1', '#fbc2eb'];
  for (var j = 0; j < 6; j++) { var d = document.createElement('div'); d.style.left = (j * 40 - 40) + 'px'; d.style.top = (j * 70) + 'px'; d.style.background = 'radial-gradient(circle,' + cols[j] + ',transparent 70%)'; d.style.animation = 'drift ' + (3 + j) + 's ease-in-out infinite alternate'; BL.appendChild(d); }
  var videos = [], strip = document.getElementById('strip');
  for (var v = 0; v < 8; v++) { var e = document.createElement('video'); e.muted = true; e.loop = true; e.playsInline = true; e.setAttribute('muted', ''); e.setAttribute('loop', ''); e.setAttribute('playsinline', ''); e.preload = 'auto'; e.src = 'clip.mp4'; strip.appendChild(e); videos.push(e); }
  var t = 0, moving = true;
  function wiggle() { if (!moving) return; t += 0.05; for (var k = 20; k < 40; k++) boxes[k].style.transform = 'translate(' + (Math.sin(t + k) * 40) + 'px,' + (Math.cos(t + k) * 20) + 'px)'; requestAnimationFrame(wiggle); }
  show('a'); requestAnimationFrame(wiggle);
  return K.cadence(ms).then(function (r) {
    out.fps_css = r.fps; out.late_a = r.late; out.gap_a = r.gap; moving = false; show('b');
    return K.sleep(300).then(function () { return K.cadence(ms); });
  }).then(function (r) {
    out.fps_blur = r.fps; out.late_b = r.late; out.gap_b = r.gap; show('c'); videos.forEach(function (x) { try { var p = x.play(); if (p && p.catch) p.catch(function () {}); } catch (e) {} });
    return K.sleep(500).then(function () { return K.cadence(ms); });
  }).then(function (r) {
    out.fps_clips = r.fps; out.late_c = r.late; out.gap_c = r.gap;
    var playing = 0; videos.forEach(function (x) { if (!x.paused && x.currentTime > 0) playing++; });
    out.clips_playing = playing;                                      // how many of the 8 really ran (Kestrel's clip limiter and press-to-play rule may hold them: that is part of what is measured)
    out.late_pct = K.round((out.late_a + out.late_b + out.late_c) / 3);
    return out;
  });
});
</script></body></html>
