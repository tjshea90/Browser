<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<!-- Decode lab (research/REVIEW-EXTERNAL-1.md 3.2, EX-4 / EX-14): the same 800x600 picture as JPEG, WebP, AVIF and JPEG XL; how long this tablet's CPU needs to decode each. Firefox sends
     image/avif and (until image.jxl.enabled is false) image/jxl in its image Accept header, so CDNs may answer with either: a smaller file is no gain if it costs more CPU than the bytes it saves. -->
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Decode lab</title>
<style>
  body{margin:0;background:#000;color:#eee;font:16px/1.45 sans-serif}
  main{padding:16px}
  h1{font-size:24px;margin:0 0 10px;color:#f6c026}
  button{width:100%;height:56px;margin:12px 0;font-size:18px;background:#f6c026;color:#000;border:0;border-radius:0}
  pre{font:14px/1.5 monospace;white-space:pre-wrap}
  .small{color:#9aa}
</style></head><body><main>
<h1>Decode lab</h1>
<p>Press Run. Each picture (800 x 600) is decoded five times from the app's own storage; the table shows the middle value in milliseconds. Nothing leaves the tablet.</p>
<button id="run">Run (about 20 seconds)</button>
<pre id="out">not run yet</pre>
<p class="small" id="env"></p>
</main>
<script>
(function () {
  var FORMATS = [['JPEG', 'lab.jpg', 126180], ['WebP', 'lab.webp', 141900], ['AVIF', 'lab.avif', 43913], ['JPEG XL', 'lab.jxl', 77538]]; // file sizes in bytes (this folder's files)
  var out = document.getElementById('out'), env = document.getElementById('env'), run = document.getElementById('run');
  env.textContent = 'cores: ' + (navigator.hardwareConcurrency || '?') + ', pixel ratio ' + window.devicePixelRatio + ', ' + navigator.userAgent.replace(/^Mozilla\/5.0 /, '');
  function once(file, n) {
    return new Promise(function (resolve) {
      var img = new Image(), t0 = performance.now();
      img.src = file + '?run=' + n + '_' + Math.random().toString(36).slice(2);   // a new address every time: no decoded-image cache hit
      if (img.decode) img.decode().then(function () { resolve(performance.now() - t0); }, function () { resolve(-1); });
      else { img.onload = function () { resolve(performance.now() - t0); }; img.onerror = function () { resolve(-1); }; }
    });
  }
  function median(a) { a = a.slice().sort(function (x, y) { return x - y; }); return a[Math.floor(a.length / 2)]; }
  run.addEventListener('click', function () {
    run.disabled = true; out.textContent = 'running...';
    var rows = [], p = Promise.resolve();
    FORMATS.forEach(function (f) {
      p = p.then(function () {
        var bytes = f[2];
        var times = [], q = Promise.resolve();
        for (var i = 0; i < 5; i++) (function (i) { q = q.then(function () { return once(f[1], i); }).then(function (ms) { times.push(ms); }); })(i);
        return q.then(function () { rows.push({ name: f[0], bytes: bytes, ms: median(times.filter(function (t) { return t >= 0; })), failed: times.every(function (t) { return t < 0; }) }); });
      });
    });
    p.then(function () {
      var jpeg = rows[0].ms, lines = ['format    file KB   decode ms   vs JPEG'];
      rows.forEach(function (r) {
        lines.push((r.name + '         ').slice(0, 9) + ' ' + ('      ' + (r.bytes < 0 ? '?' : (r.bytes / 1024).toFixed(0))).slice(-7) + '   ' + ('        ' + (r.failed ? 'cannot' : r.ms.toFixed(0))).slice(-9) + '   ' + (r.failed ? '' : (r.ms - jpeg >= 0 ? '+' : '') + (r.ms - jpeg).toFixed(0) + ' ms'));
      });
      lines.push('', 'Read it like this: a smaller file saves transfer time (about 1.6 ms per KB at 5 Mbit/s, 0.27 ms per KB at 30 Mbit/s). If a format costs more extra decode time than the transfer time it saves, it is a loss on this tablet. If AVIF is far slower than WebP, turn on Settings > Network lab > No AVIF pictures on Fast Wi-Fi.');
      out.textContent = lines.join('\n'); run.disabled = false;
    });
  });
})();
</script></body></html>
